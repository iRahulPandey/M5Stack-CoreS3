[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32@6.7.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
; Flash with ./flash.sh, not `pio run -t upload`: PlatformIO's esptool 4.5.1 drops the native USB.
; C++17 like the native tests: lib/ball brace-initialises structs that have default member values
build_unflags = -std=gnu++11
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
lib_deps =
    m5stack/M5Unified@^0.2.5
    m5stack/M5GFX@^0.2.27
test_ignore = *

; The tilt, physics and mood logic in lib/ball is plain C++, tested on the Mac: `uvx platformio test -e native`
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
