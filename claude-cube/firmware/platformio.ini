[env:cores3]
platform = espressif32@6.7.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
; Flash with ./flash.sh, not `pio run -t upload`: see the note at the top of that script.
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified@^0.2.5
    ; 0.2.27+ is needed for CoreS3 units built with the ILI9342E panel
    m5stack/M5GFX@^0.2.27
    bblanchon/ArduinoJson@^7.2.0
